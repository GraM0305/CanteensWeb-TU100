<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#174c3c">
  <title>TU Canteen Finder - ค้นหาโรงอาหาร มธ.รังสิต</title>
  <link rel="icon" type="image/svg+xml" href="fontAwesome.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen lg:h-screen lg:overflow-hidden">
  <header class="app-header px-4 sm:px-6 flex items-center justify-between relative z-10">
    <div class="flex items-center gap-3 min-w-0">
      <span class="flex items-center justify-center w-10 h-10 rounded-xl bg-white/10 text-2xl" aria-hidden="true">🍽️</span>
      <h1 class="app-header__brand text-lg sm:text-xl font-bold tracking-tight whitespace-nowrap">
        TU CANTEENS <span class="app-header__brand-accent">FINDER</span>
      </h1>
    </div>
    <div class="app-header__location">THAMMASAT<br class="sm:hidden"> RANGSIT CAMPUS</div>
  </header>

  <main class="page-shell flex flex-col lg:flex-row w-full lg:h-[calc(100vh-4rem)]">
    <section class="map-panel relative order-1 h-[42vh] min-h-[280px] lg:order-1 lg:flex-1 lg:h-auto lg:min-h-0 bg-slate-100" aria-label="แผนที่โรงอาหาร">
      <div id="map" class="w-full h-full"></div>
    </section>

    <section class="canteen-sidebar order-2 flex w-full flex-col min-h-[440px] lg:order-2 lg:w-[420px] xl:w-[440px] lg:h-full lg:min-h-0 shrink-0 bg-white border-t lg:border-t-0 lg:border-l border-slate-200">
      <div class="search-panel p-4 space-y-3 shadow-sm">
        <div class="relative">
          <input id="canteen-search" type="search" placeholder="ค้นหาชื่อโรงอาหาร..." aria-label="ค้นหาชื่อโรงอาหาร" class="search-field text-sm">
          <span class="absolute left-3 top-3 text-slate-400 text-sm" aria-hidden="true">⌕</span>
        </div>
        <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs" aria-label="กรองตามช่วงเวลาเปิด">
          <button type="button" class="period-filter is-active" data-period="ALL" aria-pressed="true">ทั้งหมด</button>
          <button type="button" class="period-filter" data-period="DAY" aria-pressed="false">☀️ กลางวัน</button>
          <button type="button" class="period-filter" data-period="NIGHT" aria-pressed="false">🌙 กลางคืน</button>
        </div>
      </div>

      <div class="canteen-sidebar__content flex-1 overflow-y-auto p-4 space-y-4">
        <div id="api-status" role="status" aria-live="polite" class="text-xs text-slate-500">กำลังเชื่อมต่อ API...</div>
        <div class="notice-panel p-3 text-xs leading-relaxed">
          ข้อมูลที่แสดงเป็นข้อมูลตัวอย่างสำหรับทดสอบระบบเท่านั้น
        </div>
        <div class="flex justify-between items-center gap-3">
          <h2 class="section-heading font-bold">ค้นหาโรงอาหาร</h2>
          <span id="canteen-count" class="count-pill">0 โรงอาหาร</span>
        </div>
        <div id="mobile-canteen-picker" class="mobile-canteen-picker">
        </div>
        <div id="canteen-list" class="space-y-3" aria-live="polite"></div>
        <section id="canteen-detail" class="is-hidden content-panel p-4 space-y-4" aria-live="polite"></section>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>

</body>
</html>
