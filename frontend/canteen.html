
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#174c3c">

  <title>รายละเอียดโรงอาหาร - TU Canteen Finder</title>
  <link rel="icon" type="image/svg+xml" href="canteen-fontAwesome.svg">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="canteen-page bg-slate-50 font-sans text-slate-800 min-h-screen">

  <header class="canteen-page__header bg-white border-b border-slate-200 shadow-sm">
    <div class="canteen-page__header-inner max-w-5xl mx-auto px-5 py-4">
      <div class="canteen-page__brand">
        <span class="canteen-page__brand-mark" aria-hidden="true">🍽️</span>
        <h1>TU CANTEENS <span class="canteen-page__brand-accent">FINDER</span></h1>
      </div>
      <a href="index.html" class="canteen-page__back">
        ← กลับไปหน้าแผนที่
      </a>
    </div>
  </header>


  <main class="canteen-page__main max-w-5xl mx-auto px-5 py-6">

    <!-- Loading / Error Status -->
    <div
      id="page-status"
      role="status"
      aria-live="polite"
      class="page-status"
    >
      กำลังโหลดข้อมูลโรงอาหาร...
    </div>


    <!-- Canteen Information -->
    <section
      id="canteen-info"
      class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5"
    >
    </section>


    <!-- Restaurant Data Notice -->
    <div class="canteen-page__notice bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
      ราคาและเวลาเปิด-ปิดอ้างอิงจากแหล่งข้อมูลที่ระบุไว้ โปรดตรวจสอบกับร้านอีกครั้ง
    </div>


    <!-- Vendors Section -->
    <section class="canteen-page__vendors bg-white rounded-2xl border border-slate-200 shadow-sm p-5">

      <div class="flex justify-between items-center gap-3">
        <h2 class="font-bold text-lg">
          ร้านค้าภายในโรงอาหาร
        </h2>

        <span
          id="vendor-count"
          class="text-xs text-slate-500"
        >
          0 ร้าน
        </span>
      </div>


      <!-- Filters -->
      <div class="canteen-page__filters grid grid-cols-1 sm:grid-cols-2 gap-4">

        <div>
          <label
            for="category-filter"
            class="block text-xs font-semibold text-slate-600 mb-2"
          >
            ประเภทอาหาร
          </label>

          <div class="canteen-page__select-wrapper">
            <select
              id="category-filter"
              class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-white"
            >
              <option value="ALL">ทุกประเภท</option>
            </select>
            <svg
              class="canteen-page__select-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M297.4 201.4C309.9 188.9 330.2 188.9 342.7 201.4L502.7 361.4C515.2 373.9 515.2 394.2 502.7 406.7C490.2 419.2 469.9 419.2 457.4 406.7L320 269.3L182.6 406.6C170.1 419.1 149.8 419.1 137.3 406.6C124.8 394.1 124.8 373.8 137.3 361.3L297.3 201.3z"
              />
            </svg>
          </div>
        </div>


        <div>
          <label
            for="halal-filter"
            class="block text-xs font-semibold text-slate-600 mb-2"
          >
            ข้อมูลฮาลาล
          </label>

          <div class="canteen-page__select-wrapper">
            <select
              id="halal-filter"
              class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-white"
            >
              <option value="ALL">ทุกสถานะ</option>
              <option value="true">ฮาลาล</option>
              <option value="false">ไม่ใช่ฮาลาล</option>
              <option value="unknown">ไม่ระบุ</option>
            </select>
            <svg
              class="canteen-page__select-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M297.4 201.4C309.9 188.9 330.2 188.9 342.7 201.4L502.7 361.4C515.2 373.9 515.2 394.2 502.7 406.7C490.2 419.2 469.9 419.2 457.4 406.7L320 269.3L182.6 406.6C170.1 419.1 149.8 419.1 137.3 406.6C124.8 394.1 124.8 373.8 137.3 361.3L297.3 201.3z"
              />
            </svg>
          </div>
        </div>

      </div>


      <!-- Vendor List -->
      <div
        id="vendor-list"
        class="grid grid-cols-1 md:grid-cols-2 gap-3"
      >
      </div>

    </section>

  </main>


  <script src="js/config.js"></script>
  <script src="js/canteen-detail.js"></script>

</body>
</html>
