
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#174c3c">

  <title>รายละเอียดโรงอาหาร - TU Canteen Finder</title>
  <link rel="icon" type="image/svg+xml" href="favicon-canteen.svg">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400..800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="canteen-page bg-slate-50 font-sans text-slate-800 min-h-screen">

  <header class="canteen-page__header bg-white border-b border-slate-200 shadow-sm">
    <div class="canteen-page__header-inner max-w-5xl mx-auto px-5 py-4">
      <div class="canteen-page__brand">
        <span class="canteen-page__brand-mark" aria-hidden="true">🍽️</span>
        <h1>TU CANTEENS <span class="canteen-page__brand-accent">FINDER</span></h1>
      </div>
      <a href="index.html" class="canteen-page__back">
        ← กลับไปหน้าแผนที่
      </a>
    </div>
  </header>


  <main class="canteen-page__main max-w-5xl mx-auto px-5 py-6">

    <!-- Loading / Error Status -->
    <div
      id="page-status"
      role="status"
      aria-live="polite"
      class="page-status"
    >
      กำลังโหลดข้อมูลโรงอาหาร...
    </div>


    <!-- Canteen Information -->
    <section
      id="canteen-info"
      class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5"
    >
    </section>


    <!-- Restaurant Data Notice -->
    <div class="canteen-page__notice bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
      ราคาและเวลาเปิด-ปิดอ้างอิงจากแหล่งข้อมูลที่ระบุไว้ โปรดตรวจสอบกับร้านอีกครั้ง
    </div>


    <!-- Vendors Section -->
    <section class="canteen-page__vendors bg-white rounded-2xl border border-slate-200 shadow-sm p-5">

      <div class="flex justify-between items-center gap-3">
        <div class="canteen-page__vendors-title">
          <h2 class="font-bold text-lg">
            ร้านค้าภายในโรงอาหาร
          </h2>

          <!-- Phone only: tap to show the data notice -->
          <button
            id="notice-toggle"
            type="button"
            class="canteen-page__notice-toggle"
            aria-expanded="false"
            aria-controls="notice-popover"
            aria-label="หมายเหตุเกี่ยวกับราคาและเวลาเปิด-ปิด"
          >
            ⓘ
          </button>
        </div>

        <span
          id="vendor-count"
          class="text-xs text-slate-500"
          role="status"
          aria-live="polite"
        >
          0 ร้าน
        </span>
      </div>

      <!-- Phone only: shown when the ⓘ button is tapped -->
      <p
        id="notice-popover"
        class="canteen-page__notice-popover"
        hidden
      >
        ราคาและเวลาเปิด-ปิดอ้างอิงจากแหล่งข้อมูลที่ระบุไว้ โปรดตรวจสอบกับร้านอีกครั้ง
      </p>


      <!-- Search by vendor name -->
      <div class="canteen-page__search">
        <label for="vendor-search" class="visually-hidden">ค้นหาร้านค้า</label>
        <input
          id="vendor-search"
          type="search"
          class="canteen-page__search-input"
          placeholder="ค้นหาชื่อร้าน"
          autocomplete="off"
          enterkeyhint="search"
          maxlength="100"
        >
      </div>


      <!-- Chip filters, all screen sizes (rendered by canteen-detail.js) -->
      <div
        id="mobile-filters"
        class="canteen-page__chips"
        role="group"
        aria-label="ตัวกรองร้านค้า"
      >
      </div>


      <!-- Vendor List -->
      <div
        id="vendor-list"
        class="grid grid-cols-1 md:grid-cols-2 gap-3"
      >
      </div>

    </section>

  </main>


  <script src="js/config.js"></script>
  <script type="module" src="js/canteen-page.js"></script>

</body>
</html>
